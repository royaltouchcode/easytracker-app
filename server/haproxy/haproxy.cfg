global
    log stdout format raw local0
    maxconn 100000

defaults
    log     global
    mode    tcp
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# =========================================================================
# 1. HTTP / HTTPS API & WEB ROUTING
# =========================================================================
frontend http_in
    mode http
    bind *:80
    default_backend easytracker_api_backend

backend easytracker_api_backend
    mode http
    server api1 easytracker-erp-backend:4000 check

# =========================================================================
# 2. TELEMATICS HIGH-THROUGHPUT GPS INGESTION PORTS
# =========================================================================
# GT06 / Concox (Port 5023)
frontend gt06_front
    bind *:5023
    default_backend gt06_back

backend gt06_back
    server traccar1 traccar-telematics-cluster:5023 check

# Teltonika (Port 5027)
frontend teltonika_front
    bind *:5027
    default_backend teltonika_back

backend teltonika_back
    server traccar1 traccar-telematics-cluster:5027 check

# Coban / Sinotrack (Port 5001)
frontend coban_front
    bind *:5001
    default_backend coban_back

backend coban_back
    server traccar1 traccar-telematics-cluster:5001 check
