<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" filter="url(#shadow)" />

  <!-- Radar Pulse Rings -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="220" r="120" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.3" />
  <circle cx="256" cy="220" r="75" fill="none" stroke="#818cf8" stroke-width="3" stroke-opacity="0.5" />

  <!-- Live Pulse Glow Center -->
  <circle cx="256" cy="220" r="30" fill="url(#glowGrad)" opacity="0.3" />

  <!-- GPS Pin Locator Shield -->
  <g transform="translate(0, -10)">
    <!-- Pin Head -->
    <path d="M256 110 C206 110 166 150 166 200 C166 265 256 340 256 340 C256 340 346 265 346 200 C346 150 306 110 256 110 Z" fill="url(#glowGrad)" filter="url(#shadow)" />
    <!-- Inner Pin Core -->
    <circle cx="256" cy="200" r="38" fill="#0f172a" />
    
    <!-- Fast Vehicle Silhouette (Car + Speed Waves) -->
    <path d="M240 185 L272 185 L282 200 L290 203 C293 203 295 205 295 208 L295 214 L288 214 C288 211 285 209 282 209 C279 209 276 211 276 214 L236 214 C236 211 233 209 230 209 C227 209 224 211 224 214 L217 214 L217 208 C217 205 219 203 222 203 L230 200 Z" fill="#38bdf8" />
    <circle cx="230" cy="214" r="3" fill="#ffffff" />
    <circle cx="282" cy="214" r="3" fill="#ffffff" />
    
    <!-- Live Pulse Dot -->
    <circle cx="256" cy="165" r="5" fill="#34d399" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    Easy<tspan fill="#38bdf8">Tracker</tspan>
  </text>
  
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    GPS TRACKING SYSTEM
  </text>
</svg>
